plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = "com.kobakei.ratethisapp"

    compileSdkVersion 25

    defaultConfig {
        minSdkVersion 9
        targetSdkVersion 25
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
      release {
        minifyEnabled false
      }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:25.3.1'
    testImplementation 'junit:junit:4.12'
    testImplementation "org.robolectric:robolectric:3.5"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.nitram84'
                artifactId = 'ratethisapp'
                version = '1.2.0-SNAPSHOT'
            }
        }
    }
}
